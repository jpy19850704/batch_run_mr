spring.application.name=mr-springboot-app
server.port=${MR_SERVER_PORT:8081}
server.shutdown=graceful
spring.main.banner-mode=console
spring.datasource.url=${MR_JOB_DB_URL:jdbc:h2:file:E:/zcyh_mr/H2db/mr_input_store;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${MR_JOB_DB_USERNAME:sa}
spring.datasource.password=${MR_JOB_DB_PASSWORD:}
spring.datasource.driver-class-name=${MR_JOB_DB_DRIVER:org.h2.Driver}
spring.datasource.hikari.maximum-pool-size=${MR_JOB_DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${MR_JOB_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${MR_JOB_DB_POOL_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${MR_JOB_DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${MR_JOB_DB_POOL_MAX_LIFETIME_MS:1800000}
# ---- Doris 切换备注 ----
# 切换到 Doris 时，设置以下环境变量（无需修改本文件）：
#   MR_JOB_DB_URL=jdbc:mysql://doris-fe-host:9030/mr_db?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
#   MR_JOB_DB_USERNAME=root
#   MR_JOB_DB_PASSWORD=<password>
#   MR_JOB_DB_DRIVER=com.mysql.cj.jdbc.Driver
#   MR_JOB_DB_INIT_SCHEMA=false
# 建表 DDL 见：resources/db/mr_output_schema_doris.sql
# 注意：Doris 不支持 H2 的 INFORMATION_SCHEMA.TABLES 查询，
#       PricingResultPersistService 中的 allRequiredTablesExist() 需改用 SHOW TABLES LIKE。
# ---- Doris 切换备注结束 ----
mr.job.executor.core-size=${MR_JOB_CORE_SIZE:4}
mr.job.executor.max-size=${MR_JOB_MAX_SIZE:16}
mr.job.executor.queue-capacity=${MR_JOB_QUEUE_CAPACITY:1000}
mr.job.store.jdbc.init-schema=${MR_JOB_DB_INIT_SCHEMA:true}
mr.job.store.node-id=${MR_JOB_NODE_ID:node-default}
mr.job.store.cleanup.every-submit=${MR_JOB_CLEANUP_EVERY_SUBMIT:100}
mr.job.store.cleanup.retention-days=${MR_JOB_CLEANUP_RETENTION_DAYS:7}
mr.job.store.retry.max-attempts=${MR_JOB_DB_RETRY_MAX_ATTEMPTS:3}
mr.job.store.retry.backoff-ms=${MR_JOB_DB_RETRY_BACKOFF_MS:80}
mr.job.client.poll-after-ms=${MR_JOB_CLIENT_POLL_AFTER_MS:500}
mr.job.api.base-path=${MR_JOB_API_BASE_PATH:/api/v1/jobs}
mr.job.dispatcher.enabled=${MR_JOB_DISPATCHER_ENABLED:true}
mr.job.dispatcher.interval-ms=${MR_JOB_DISPATCHER_INTERVAL_MS:500}
mr.job.dispatcher.claim-batch-size=${MR_JOB_DISPATCHER_CLAIM_BATCH_SIZE:50}
mr.job.dispatcher.stale-pending-ms=${MR_JOB_DISPATCHER_STALE_PENDING_MS:30000}
mr.job.dispatcher.stale-running-ms=${MR_JOB_DISPATCHER_STALE_RUNNING_MS:600000}
mr.job.executor.shutdown-await-seconds=${MR_JOB_EXECUTOR_SHUTDOWN_AWAIT_SECONDS:30}
spring.mvc.async.request-timeout=${MR_SYNC_REQUEST_TIMEOUT_MS:300000}
mr.job.engine.retry.max-attempts=${MR_JOB_ENGINE_RETRY_MAX_ATTEMPTS:2}
mr.job.engine.retry.backoff-ms=${MR_JOB_ENGINE_RETRY_BACKOFF_MS:200}
mr.batch.weight-budget=${MR_BATCH_WEIGHT_BUDGET:100}
mr.batch.weight-default=${MR_BATCH_WEIGHT_DEFAULT:5}
mr.batch.product-weight-rules=${MR_BATCH_PRODUCT_WEIGHT_RULES:}
mr.batch.client.poll-after-ms=${MR_BATCH_CLIENT_POLL_AFTER_MS:500}
mr.batch.api.base-path=${MR_BATCH_API_BASE_PATH:/api/v1/jobs/batch}
mr.security.enabled=${MR_SECURITY_ENABLED:false}
mr.security.exclude-paths=${MR_SECURITY_EXCLUDE_PATHS:/healthz,/readyz,/error}
mr.security.tokens=${MR_SECURITY_TOKENS:}
mr.security.require-user-header=${MR_SECURITY_REQUIRE_USER_HEADER:false}
mr.security.trust-source-headers=${MR_SECURITY_TRUST_SOURCE_HEADERS:true}
mr.audit.enabled=${MR_AUDIT_ENABLED:true}
mr.alert.enabled=${MR_ALERT_ENABLED:true}
mr.alert.suppress-window-ms=${MR_ALERT_SUPPRESS_WINDOW_MS:60000}
mr.alert.pending-job-threshold=${MR_ALERT_PENDING_JOB_THRESHOLD:200}
mr.alert.executor-queue-threshold=${MR_ALERT_EXECUTOR_QUEUE_THRESHOLD:800}
mr.calendar.store.path=${MR_CALENDAR_STORE_PATH:E:/zcyh_mr/engine/calendar_data}
mr.calendar.default-code=${MR_CALENDAR_DEFAULT_CODE:}
mr.calc.scenario-set.root-dir=${MR_CALC_SCENARIO_SET_ROOT_DIR:E:/zcyh_mr/engine/scenario_sets}
mr.frtb.batch-executor.core-size=${MR_FRTB_BATCH_EXECUTOR_CORE_SIZE:4}
mr.frtb.batch-executor.max-size=${MR_FRTB_BATCH_EXECUTOR_MAX_SIZE:8}
mr.frtb.batch-executor.queue-capacity=${MR_FRTB_BATCH_EXECUTOR_QUEUE_CAPACITY:512}
mr.scenario.service.enabled=${MR_SCENARIO_SERVICE_ENABLED:true}
mr.scenario.datasource.url=${MR_SCENARIO_DB_URL:jdbc:h2:file:E:/zcyh_mr/H2db/mr_input_store;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
mr.scenario.datasource.username=${MR_SCENARIO_DB_USERNAME:sa}
mr.scenario.datasource.password=${MR_SCENARIO_DB_PASSWORD:}
mr.scenario.datasource.driver-class-name=${MR_SCENARIO_DB_DRIVER:org.h2.Driver}
mr.scenario.datasource.hikari.maximum-pool-size=${MR_SCENARIO_DB_POOL_MAX_SIZE:8}
mr.scenario.datasource.hikari.minimum-idle=${MR_SCENARIO_DB_POOL_MIN_IDLE:1}
mr.scenario.datasource.hikari.connection-timeout=${MR_SCENARIO_DB_POOL_CONN_TIMEOUT_MS:30000}
mr.scenario.datasource.hikari.idle-timeout=${MR_SCENARIO_DB_POOL_IDLE_TIMEOUT_MS:600000}
mr.scenario.datasource.hikari.max-lifetime=${MR_SCENARIO_DB_POOL_MAX_LIFETIME_MS:1800000}
mr.scenario.executor.core-size=${MR_SCENARIO_EXECUTOR_CORE_SIZE:4}
mr.scenario.executor.max-size=${MR_SCENARIO_EXECUTOR_MAX_SIZE:8}
mr.scenario.executor.queue-capacity=${MR_SCENARIO_EXECUTOR_QUEUE_CAPACITY:1024}
