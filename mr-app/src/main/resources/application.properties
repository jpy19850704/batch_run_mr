spring.application.name=mr-springboot-app
server.port=${MR_SERVER_PORT:8081}
server.shutdown=graceful
spring.main.banner-mode=console
mr.log.dir=${MR_LOG_DIR:./logs}
# ---- engine_result_db（Doris 输出库）默认配置说明 ----
# 如需覆盖本地默认连接，可设置以下环境变量：
#   ENGINE_RESULT_DB_URL=jdbc:mysql://doris-fe-host:9030/engine_result_db?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true
#   ENGINE_RESULT_DB_USERNAME=root
#   ENGINE_RESULT_DB_PASSWORD=<password>
#   ENGINE_RESULT_DB_DRIVER=com.mysql.cj.jdbc.Driver
# 建表 DDL 见：resources/db/mr_output_schema_doris.sql
# ---- engine_result_db 默认配置说明结束 ----
engineresultdb.datasource.url=${ENGINE_RESULT_DB_URL:jdbc:mysql://127.0.0.1:9030/engine_result_db?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true}
engineresultdb.datasource.username=${ENGINE_RESULT_DB_USERNAME:root}
engineresultdb.datasource.password=${ENGINE_RESULT_DB_PASSWORD:pwd123}
engineresultdb.datasource.driver-class-name=${ENGINE_RESULT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
engineresultdb.datasource.hikari.maximum-pool-size=${ENGINE_RESULT_DB_POOL_MAX_SIZE:20}
engineresultdb.datasource.hikari.minimum-idle=${ENGINE_RESULT_DB_POOL_MIN_IDLE:2}
engineresultdb.datasource.hikari.connection-timeout=${ENGINE_RESULT_DB_POOL_CONN_TIMEOUT_MS:30000}
engineresultdb.datasource.hikari.idle-timeout=${ENGINE_RESULT_DB_POOL_IDLE_TIMEOUT_MS:600000}
engineresultdb.datasource.hikari.max-lifetime=${ENGINE_RESULT_DB_POOL_MAX_LIFETIME_MS:1800000}

# ---- engine_db（MySQL 输入/任务库）默认配置说明 ----
enginedb.datasource.url=${ENGINE_DB_URL:jdbc:mysql://127.0.0.1:13306/engine_db?useUnicode=true&characterEncoding=UTF-8&rewriteBatchedStatements=true&serverTimezone=Asia/Shanghai}
enginedb.datasource.username=${ENGINE_DB_USERNAME:root}
enginedb.datasource.password=${ENGINE_DB_PASSWORD:pwd123}
enginedb.datasource.driver-class-name=${ENGINE_DB_DRIVER:com.mysql.cj.jdbc.Driver}
enginedb.datasource.hikari.maximum-pool-size=${ENGINE_DB_POOL_MAX_SIZE:8}
enginedb.datasource.hikari.minimum-idle=${ENGINE_DB_POOL_MIN_IDLE:1}
enginedb.datasource.hikari.connection-timeout=${ENGINE_DB_POOL_CONN_TIMEOUT_MS:30000}
enginedb.datasource.hikari.idle-timeout=${ENGINE_DB_POOL_IDLE_TIMEOUT_MS:600000}
enginedb.datasource.hikari.max-lifetime=${ENGINE_DB_POOL_MAX_LIFETIME_MS:1800000}
# ---- engine_db 默认配置说明结束 ----
mr.job.executor.core-size=${MR_JOB_CORE_SIZE:4}
mr.job.executor.max-size=${MR_JOB_MAX_SIZE:16}
mr.job.executor.queue-capacity=${MR_JOB_QUEUE_CAPACITY:1000}
mr.job.store.node-id=${MR_JOB_NODE_ID:node-default}
mr.job.store.cleanup.every-submit=${MR_JOB_CLEANUP_EVERY_SUBMIT:100}
mr.job.store.cleanup.retention-days=${MR_JOB_CLEANUP_RETENTION_DAYS:7}
mr.job.store.retry.max-attempts=${ENGINE_DB_RETRY_MAX_ATTEMPTS:3}
mr.job.store.retry.backoff-ms=${ENGINE_DB_RETRY_BACKOFF_MS:80}
mr.job.client.poll-after-ms=${MR_JOB_CLIENT_POLL_AFTER_MS:500}
mr.job.api.base-path=${MR_JOB_API_BASE_PATH:/api/jobs}
mr.job.dispatcher.enabled=${MR_JOB_DISPATCHER_ENABLED:true}
mr.job.dispatcher.interval-ms=${MR_JOB_DISPATCHER_INTERVAL_MS:500}
mr.job.dispatcher.claim-batch-size=${MR_JOB_DISPATCHER_CLAIM_BATCH_SIZE:50}
mr.job.dispatcher.stale-pending-ms=${MR_JOB_DISPATCHER_STALE_PENDING_MS:30000}
mr.job.dispatcher.stale-running-ms=${MR_JOB_DISPATCHER_STALE_RUNNING_MS:600000}
mr.job.executor.shutdown-await-seconds=${MR_JOB_EXECUTOR_SHUTDOWN_AWAIT_SECONDS:30}
spring.mvc.async.request-timeout=${MR_SYNC_REQUEST_TIMEOUT_MS:300000}
mr.job.engine.retry.max-attempts=${MR_JOB_ENGINE_RETRY_MAX_ATTEMPTS:2}
mr.job.engine.retry.backoff-ms=${MR_JOB_ENGINE_RETRY_BACKOFF_MS:200}
mr.batch.weight-budget=${MR_BATCH_WEIGHT_BUDGET:100}
mr.batch.weight-default=${MR_BATCH_WEIGHT_DEFAULT:5}
mr.batch.product-weight-rules=${MR_BATCH_PRODUCT_WEIGHT_RULES:}
mr.batch.client.poll-after-ms=${MR_BATCH_CLIENT_POLL_AFTER_MS:500}
mr.batch.api.base-path=${MR_BATCH_API_BASE_PATH:/api/jobs/batch}
mr.security.enabled=${MR_SECURITY_ENABLED:true}
mr.cors.allowed-origins=${MR_CORS_ALLOWED_ORIGINS:}
mr.security.exclude-paths=${MR_SECURITY_EXCLUDE_PATHS:/healthz,/readyz,/error}
mr.security.tokens=${MR_SECURITY_TOKENS:mr-web-token:zcyh-web}
mr.security.require-user-header=${MR_SECURITY_REQUIRE_USER_HEADER:false}
mr.security.trust-source-headers=${MR_SECURITY_TRUST_SOURCE_HEADERS:false}
mr.audit.enabled=${MR_AUDIT_ENABLED:true}
mr.alert.enabled=${MR_ALERT_ENABLED:true}
mr.alert.suppress-window-ms=${MR_ALERT_SUPPRESS_WINDOW_MS:60000}
mr.alert.pending-job-threshold=${MR_ALERT_PENDING_JOB_THRESHOLD:200}
mr.alert.executor-queue-threshold=${MR_ALERT_EXECUTOR_QUEUE_THRESHOLD:800}
mr.calendar.store.path=${MR_CALENDAR_STORE_PATH:./calendar_data}
mr.calendar.default-code=${MR_CALENDAR_DEFAULT_CODE:}
mr.calc.scenario-set.root-dir=${MR_CALC_SCENARIO_SET_ROOT_DIR:./scenario_sets}
mr.sobol.cache.dir=${MR_SOBOL_CACHE_DIR:./data/sobol-cache}
mr.mc.path.dir=${MR_MC_PATH_DIR:./data/mc_path}
mr.batch.result.dir=${MR_BATCH_RESULT_DIR:./data/batch-result}
mr.frtb.batch-executor.core-size=${MR_FRTB_BATCH_EXECUTOR_CORE_SIZE:4}
mr.frtb.batch-executor.max-size=${MR_FRTB_BATCH_EXECUTOR_MAX_SIZE:8}
mr.frtb.batch-executor.queue-capacity=${MR_FRTB_BATCH_EXECUTOR_QUEUE_CAPACITY:512}
mr.scenario.service.enabled=${MR_SCENARIO_SERVICE_ENABLED:true}
mr.scenario.executor.core-size=${MR_SCENARIO_EXECUTOR_CORE_SIZE:4}
mr.scenario.executor.max-size=${MR_SCENARIO_EXECUTOR_MAX_SIZE:8}
mr.scenario.executor.queue-capacity=${MR_SCENARIO_EXECUTOR_QUEUE_CAPACITY:1024}

# ---- VaR 维度明细缓存（Redis） ----
spring.redis.host=${MR_REDIS_HOST:127.0.0.1}
spring.redis.port=${MR_REDIS_PORT:6379}
spring.redis.password=${MR_REDIS_PASSWORD:}
mr.var.detail.redis.ttl-seconds=${MR_VAR_DETAIL_REDIS_TTL_SECONDS:1800}
