# =============================================================================
# 包内基础配置
# =============================================================================
# 应用名称，用于 Spring Boot 应用标识。
spring.application.name=mr-springboot-app
# 服务关闭方式，graceful 表示优雅停机。
server.shutdown=graceful
# Spring Boot 启动横幅输出模式。
spring.main.banner-mode=console

# =============================================================================
# 固定技术契约
# =============================================================================
# Doris 输出库 JDBC 驱动类。
engineresultdb.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 输入/任务库 JDBC 驱动类。
enginedb.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 单笔任务 API 基础路径。
mr.job.api.base-path=/api/jobs
# 批量任务 API 基础路径。
mr.batch.api.base-path=/api/jobs/batch
# 跳过安全校验的固定接口路径。
mr.security.exclude-paths=/healthz,/readyz,/error
