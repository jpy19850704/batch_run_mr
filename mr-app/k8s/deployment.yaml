apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-app
  labels:
    app: mr-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mr-app
  template:
    metadata:
      labels:
        app: mr-app
    spec:
      containers:
        - name: mr-app
          image: your-registry/mr-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: MR_SERVER_PORT
              value: "8080"
            - name: MR_JOB_DB_URL
              value: "jdbc:mysql://mysql:3306/mr?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai"
            - name: MR_JOB_DB_USERNAME
              value: "mr_user"
            - name: MR_JOB_DB_PASSWORD
              value: "mr_password"
            - name: MR_JOB_DB_DRIVER
              value: "com.mysql.cj.jdbc.Driver"
            - name: MR_JOB_DB_INIT_SCHEMA
              value: "true"
            - name: MR_JOB_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

